services:
  # PostgreSQL Database for User Service
  user-db:
    image: postgres:16-alpine
    container_name: ai-study-planner-user-db
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./infra/init-user-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-study-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for AI Schedule Service
  schedule-db:
    image: postgres:16-alpine
    container_name: ai-study-planner-schedule-db
    environment:
      POSTGRES_DB: ai_schedule_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - schedule_db_data:/var/lib/postgresql/data
      - ./infra/init-schedule-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-study-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-study-planner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-study-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: ai-study-planner-user-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres123@user-db:5432/user_service_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: user-service
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    # Ports removed - access only through nginx gateway (port 8080)
    # ports:
    #   - "3001:3001"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-study-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Schedule Service
  ai-schedule-service:
    build:
      context: ./services/ai-schedule-service
      dockerfile: Dockerfile
    container_name: ai-study-planner-ai-schedule-service
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres123@schedule-db:5432/ai_schedule_db?schema=public
      USER_SERVICE_URL: http://user-service:3001
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      AI_RETRY_MAX_ATTEMPTS: 3
      AI_RETRY_INITIAL_DELAY_MS: 1000
      AI_RETRY_MAX_DELAY_MS: 10000
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      SERVICE_TIMEOUT: 10000
      SERVICE_RETRY_ATTEMPTS: 3
    # Ports removed - access only through nginx gateway (port 8080)
    # ports:
    #   - "3002:3002"
    depends_on:
      schedule-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-study-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NGINX API Gateway
  nginx-gateway:
    build:
      context: ./apps/nginx-gateway
      dockerfile: Dockerfile
    container_name: ai-study-planner-nginx-gateway
    environment:
      NGINX_HOST: 0.0.0.0
      NGINX_PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
      - "8090:8090"
    depends_on:
      user-service:
        condition: service_healthy
      ai-schedule-service:
        condition: service_healthy
    networks:
      - ai-study-network
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  user_db_data:
    driver: local
  schedule_db_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-study-network:
    driver: bridge
