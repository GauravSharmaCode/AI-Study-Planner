# Nginx API Gateway Configuration
# High-performance reverse proxy for AI Study Planner microservices

# Error logging (simplified)
error_log /var/log/nginx/error.log warn;

# Number of worker processes
worker_processes auto;

# Events block - worker connections
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP block
http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;
    
    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Upstream Servers
    upstream user_service {
        server user-service:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream ai_schedule_service {
        server ai-schedule-service:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Main API Gateway Server (Port 8080)
    server {
        listen 8080;
        server_name _;
        
        # Security Headers (at server level)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With" always;
        
        # Connection limiting
        limit_conn conn_limit 20;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # Gateway Information Endpoint
        location = / {
            default_type application/json;
            return 200 '{"service":"nginx-api-gateway","version":"2.0.0","message":"AI Study Planner API Gateway","timestamp":"$time_iso8601","endpoints":["/api/v1/auth/*","/api/v1/users/*","/api/v1/schedules/*","/api/v1/study-plans/*"]}';
        }
        
        # Main Health Check
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-api-gateway","timestamp":"$time_iso8601","version":"2.0.0"}';
        }
        
        # Authentication Routes - User Service (v1)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            
            proxy_pass http://user_service/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # User Management Routes - User Service (v1)
        location /api/v1/users/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://user_service/api/v1/users/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Schedule Routes - AI Schedule Service
        location /api/v1/schedules/ {
            limit_req zone=ai_limit burst=20 nodelay;
            
            proxy_pass http://ai_schedule_service/api/v1/schedules/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # Study Plans Routes - AI Schedule Service
        location /api/v1/study-plans/ {
            limit_req zone=ai_limit burst=20 nodelay;
            
            proxy_pass http://ai_schedule_service/api/v1/study-plans/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # Service Health Aggregation
        location = /api/v1/health/services {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","message":"Use individual service health endpoints","services":{"user-service":"http://user-service:3001/health","ai-schedule-service":"http://ai-schedule-service:3002/health"},"timestamp":"$time_iso8601"}';
        }
        
        # Default 404 Handler
        location / {
            default_type application/json;
            return 404 '{"error":"Route not found","message":"The requested endpoint does not exist","available_endpoints":["/api/v1/auth/*","/api/v1/users/*","/api/v1/schedules/*","/api/v1/study-plans/*","/health"],"timestamp":"$time_iso8601"}';
        }
    }
    
    # Internal Health Check Server (Port 8090)
    server {
        listen 8090;
        server_name _;
        access_log off;
        
        # Simple health check
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-gateway-internal","timestamp":"$time_iso8601"}';
        }
        
        # NGINX status (internal only)
        location = /nginx-health {
            stub_status on;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
